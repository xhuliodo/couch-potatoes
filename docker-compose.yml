services:
  # Neo4j database, built from ./db. Seeding runs only when the graph is empty.
  cp-db:
    build: ./db
    image: couch-potatoes-db:local
    container_name: cp-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # NEO4J_AUTH is the user/password pair Neo4j starts with; the import
      # entrypoint splits it back into NEO4J_USER and NEO4J_PASSWORD.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-letmein}"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - "./db/data:/data"
      - "./db/import:/import"
    healthcheck:
      # cypher-shell proves Bolt is up with the configured credentials, not
      # just that the HTTP browser port answered. Seeding can take a while, so
      # keep the start period generous.
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # Go API, built from ./clean-api. It must not start before the database
  # answers, otherwise the JWKS bootstrap and the driver race the seed.
  cp-api:
    build: ./clean-api
    image: couch-potatoes-api:local
    container_name: cp-api
    ports:
      - "4001:4001"
    environment:
      NEO4J_URI: "${NEO4J_URI:-bolt://cp-db:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-letmein}"
      API_LISTEN_PORT: "${API_LISTEN_PORT:-:4001}"
      API_ALLOWED_ORIGINS: "${API_ALLOWED_ORIGINS:-http://localhost:3000}"
      JWKS_URL: "${JWKS_URL:-https://dev-ps5dqqis.eu.auth0.com/.well-known/jwks.json}"
      JWKS_CACHE_PATH: "${JWKS_CACHE_PATH:-/auth/jwks.json}"
    depends_on:
      cp-db:
        condition: service_healthy
    healthcheck:
      # /healthcheck verifies database connectivity, so healthy means the API
      # is up and can reach Neo4j.
      # 127.0.0.1 avoids busybox wget trying the IPv6 ::1 address first.
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1$${API_LISTEN_PORT:-:4001}/healthcheck\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # The API drains in-flight requests for up to 10s internally.
    stop_grace_period: 15s

  # React client, built from ./client and served by nginx on port 3000.
  cp-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH0_DOMAIN: "${REACT_APP_AUTH0_DOMAIN:-dev-ps5dqqis.eu.auth0.com}"
        REACT_APP_AUTH0_CLIENT_ID: "${REACT_APP_AUTH0_CLIENT_ID:-DqbCvZtL8cn5plDla9TYlrJLhWIXpZtV}"
        REACT_APP_REDIRECT_BASE: "${REACT_APP_REDIRECT_BASE:-http://localhost:3000}"
        REACT_APP_API_ENDPOINT: "${REACT_APP_API_ENDPOINT:-http://localhost:4001}"
        REACT_APP_THUMBNAILS_ENDPOINT: "${REACT_APP_THUMBNAILS_ENDPOINT:-http://localhost:4003}"
    image: couch-potatoes-client:local
    container_name: cp-client
    ports:
      - "3000:3000"
    depends_on:
      cp-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Static thumbnails, served by nginx from the local posters directory.
  cp-thumbnails:
    build:
      context: ./thumbnails
      dockerfile: Dockerfile
    image: couch-potatoes-thumbnails:local
    container_name: cp-thumbnails
    ports:
      - "4003:80"
    volumes:
      - "./thumbnails/img:/var/www/thumbnails"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
